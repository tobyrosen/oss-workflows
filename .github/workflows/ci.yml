# Reusable CI workflow (single source of truth)
# Lives at tobyrosen/oss-workflows/.github/workflows/ci.yml. Each repo calls it
# via a ~6-line caller:
#   jobs: { ci: { uses: tobyrosen/oss-workflows/.github/workflows/ci.yml@v1 } }
#
# This is the structural end of the copy-propagation churn: CI logic changes
# here ONCE; callers pin @v1 so nothing moves in them until the tag is bumped.
#
# Runs:
#   - secrets scan (gitleaks) — BLOCKING
#   - pre-commit structural/safety — BLOCKING; style/format — ADVISORY
#   - Python: pytest + coverage + bandit (if pyproject.toml/requirements.txt)
#   - JS/TS: build + npm test (if package.json)
#   - Rust: cargo test + clippy (if Cargo.toml)
#   - dependency-scan (OSV) on PRs
#   - security-scan on PRs: Socket (blocking); Semgrep + Trivy (advisory)
#
# github.event_name inside a called workflow reflects the CALLER's event, so the
# PR-only dependency-scan and security-scan gates still work.
# Callers that want the Socket scan need `secrets: inherit` (or to pass
# SOCKET_SECURITY_API_KEY); everything else still needs no secrets.

name: CI

on:
  workflow_call:
    secrets:
      SOCKET_SECURITY_API_KEY:
        required: false

jobs:
  detect:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-detect-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.check.outputs.python }}
      js: ${{ steps.check.outputs.js }}
      rust: ${{ steps.check.outputs.rust }}
      iac: ${{ steps.check.outputs.iac }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f package.json ]; then
            echo "js=true" >> "$GITHUB_OUTPUT"
          else
            echo "js=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f Cargo.toml ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          iac_file=$(find . -maxdepth 3 -type d \( -name node_modules -o -name target \) -prune -o -type f \( -name 'Dockerfile*' -o -name 'docker-compose*.yml' -o -name 'docker-compose*.yaml' -o -name compose.yaml -o -name '*.tf' \) -print -quit)
          if [ -n "$iac_file" ]; then
            echo "iac=true" >> "$GITHUB_OUTPUT"
          else
            echo "iac=false" >> "$GITHUB_OUTPUT"
          fi

  # Secrets scan — BLOCKING. The one security gate that always reds main.
  # Runs the gitleaks binary directly (no gitleaks-action license needed on
  # private/org repos). Catches committed tokens, keys, and credentials.
  secrets:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-secrets-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks (secret scan)
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  # Lint / format / type hooks — ADVISORY, never blocks main.
  # The same hooks auto-FIX locally on commit (prettier / ruff / markdownlint /
  # eof-fixer); in CI they can't re-stage, so blocking here only red-X'd repos
  # whose existing code predated the gate. Secrets block via the `secrets` job
  # above; build via the language jobs; vulns via dependency-scan. This is the
  # gate right-size — style is a local convenience, not a merge gate.
  # (Toby, 2026-06-05: kill the fleet-wide CI churn.)
  pre-commit:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-pre-commit-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@v6
      # Python is the pre-commit runtime (pip install pre-commit below), so it is
      # always needed regardless of the repo's language.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Node is only needed for the JS/TS lint hooks (eslint); skip it on
      # Python/Rust-only repos so they don't pull an unused toolchain.
      - uses: actions/setup-node@v6
        if: needs.detect.outputs.js == 'true'
        with:
          node-version: "22"
      # Rust toolchain so the rustfmt/clippy advisory hooks resolve on Rust repos;
      # without it they error in the advisory step (harmless but noisy log red).
      - uses: dtolnay/rust-toolchain@stable
        if: needs.detect.outputs.rust == 'true'
      # JS/TS repos: install node deps so the eslint pre-commit hook
      # (`npx --no-install eslint`) can resolve a locally-installed eslint.
      # Gated on detect so Python/Rust-only repos skip it. npm ci is used for a
      # clean, lockfile-pinned install; falls back to npm install if out of sync.
      - name: Install node deps (JS/TS lint hooks)
        if: needs.detect.outputs.js == 'true'
        run: npm ci || npm install
      - run: pip install pre-commit
      # Structural / safety hooks BLOCK — malformed YAML/JSON/TOML, committed
      # merge-conflict markers, oversized files, and private keys must fail CI.
      # Only style/format is demoted to advisory. Style hooks are SKIP-listed here
      # (they run in the advisory step below); SKIP silently ignores any hook a
      # given repo doesn't define.
      - name: pre-commit — structural / safety (blocking)
        env:
          SKIP: trailing-whitespace,end-of-file-fixer,mixed-line-ending,markdownlint,typos,ruff,ruff-format,pyright,prettier,eslint,rustfmt,clippy
        run: pre-commit run --all-files --show-diff-on-failure
      # Style / format — ADVISORY: findings are reported in the log but never red
      # main. The same hooks auto-FIX locally on commit, which is where formatting
      # belongs. This is the gate right-size — style is a local convenience.
      - name: pre-commit — style / format (advisory)
        run: pre-commit run --all-files --show-diff-on-failure
        continue-on-error: true

  python:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-python-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.12
      - name: Install deps
        run: |
          if [ -f pyproject.toml ]; then
            uv sync --all-extras || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov bandit pip-audit
      - name: Run pytest
        run: |
          if [ -d tests ] || [ -d test ]; then
            pytest --cov --cov-report=xml || echo "No tests collected"
          else
            echo "No tests directory — skipping pytest"
          fi
      - name: Run bandit (Python security scan)
        run: bandit -r . -x ./tests,./test,./.venv,./venv,./node_modules -ll || true
        continue-on-error: true
      - name: Run pip-audit (dependency CVE scan)
        run: pip-audit --strict || true
        continue-on-error: true

  js:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-js-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.js == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install deps
        run: |
          if [ -f pnpm-lock.yaml ]; then
            npm install -g pnpm && pnpm install
          elif [ -f bun.lockb ] || [ -f bun.lock ]; then
            npm install -g bun && bun install
          else
            npm install
          fi
      # Build — BLOCKING where a build script exists (skipped if absent).
      # "The code builds" is a real gate; style is not.
      - name: Build
        run: npm run build --if-present
      - name: Run tests
        run: npm test --if-present
      - name: Run npm audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

  rust:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-rust-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      - run: cargo clippy --all-targets -- -D warnings

  dependency-scan:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-dependency-scan-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # OSV-Scanner (Google) scans lockfiles against the OSV.dev vulnerability DB.
    # Replaces dependency-review-action, which requires GitHub Advanced Security
    # (Dependency Graph + Code Security). GHAS is unavailable on the AsiaProGolf org
    # AND on personal private repos, so dependency-review red-X'd every PR there.
    # OSV-Scanner is free and runs on ANY repo — public, private, any org — with no
    # GHAS dependency. We use the COMPOSITE action (not the reusable PR workflow):
    # the reusable workflow uploads SARIF to the Security tab, which on private repos
    # is itself a GHAS feature and would hit the same wall. The composite action runs
    # the scanner in-container, prints findings to the job log, and fails the job on
    # any known vuln. (Toby, 2026-06-05: keep a working check everywhere, don't skip.)
    # NOTE: scans the whole lockfile and fails on any severity — stricter than the old
    # fail-on-severity:high diff gate. Add a .osv-scanner.toml allowlist for false
    # positives. Docs: https://google.github.io/osv-scanner/github-action/
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      # Repo-level allowlist (osv-scanner.toml at repo root) must be passed via
      # --config to apply GLOBALLY: auto-discovered configs are directory-local
      # and never reach nested lockfiles (e.g. src-tauri/Cargo.lock). Entries
      # require a reason + owner review date. (Fixed 2026-08-04; mirrors the
      # fleet-ci central-floor+appendix fix.)
      - name: Prepare OSV-Scanner config
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/osv-scanner.toml" ]; then
            echo "# no repo-level allowlist" > "$GITHUB_WORKSPACE/osv-scanner.toml"
          fi
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            --config /github/workspace/osv-scanner.toml
            ./

  # Three fleet security layers share one PR-only job to avoid the per-job
  # 1-minute billing minimum. Socket blocks; Semgrep and Trivy tune advisory.
  # Socket free tier = 1,000 scans/mo, which is why this is PR-only.
  security-scan:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (the mrfixcode-gate consumes them).
    concurrency:
      group: ci-security-scan-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: detect
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Socket supply-chain scan (blocking when configured)
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -z "$SOCKET_CLI_API_TOKEN" ]; then
            echo "Socket scan skipped — no SOCKET_SECURITY_API_KEY in caller context"
            exit 0
          fi
          npm install --global socket@1.1.147
          repo_name=${GITHUB_REPOSITORY#*/}
          # --org: Socket-side org slug (one org spans all three GitHub
          # namespaces). Provisional org created 2026-08-07; if it is ever
          # renamed, this is the one central line to update.
          socket scan create \
            --org=demo-i61vr \
            --report \
            --report-level=error \
            --no-interactive \
            --repo="$repo_name" \
            --branch="$GITHUB_HEAD_REF" \
            .
      # non-blocking during the tuning window; promote to blocking after ~2 weeks
      # (decided Toby 2026-08-07, REVISIT 2026-08-21).
      - name: Semgrep CE (SAST, advisory)
        run: |
          pip install semgrep==1.172.0
          semgrep scan \
            --error \
            --config p/python \
            --config p/javascript \
            --config p/typescript \
            --config p/dockerfile \
            --config p/github-actions \
            --exclude='**/.venv/**' \
            --exclude='**/node_modules/**' \
            --exclude='**/target/**' \
            --exclude='**/tests/fixtures/**' \
            --exclude='**/test/fixtures/**' \
            .
        continue-on-error: true
      # Pin-and-verify is standing process after Trivy's March 2026 release-pipeline compromise.
      # No `trivy fs` here: OSV-Scanner in dependency-scan owns lockfile vulns.
      # non-blocking during the tuning window; promote to blocking after ~2 weeks
      # (decided Toby 2026-08-07, REVISIT 2026-08-21).
      - name: Trivy config (IaC / Dockerfile misconfig, advisory)
        if: needs.detect.outputs.iac == 'true'
        run: |
          VER=0.73.0
          ARCHIVE="trivy_${VER}_Linux-64bit.tar.gz"
          CHECKSUMS="trivy_${VER}_checksums.txt"
          TRIVY_SHA256=2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b
          RELEASE_URL="https://github.com/aquasecurity/trivy/releases/download/v${VER}"
          curl -sSfL "${RELEASE_URL}/${ARCHIVE}" -o "$ARCHIVE"
          curl -sSfL "${RELEASE_URL}/${CHECKSUMS}" -o "$CHECKSUMS"
          published_sha=$(awk -v archive="$ARCHIVE" '$2 == archive { print $1 }' "$CHECKSUMS")
          if [ "$published_sha" != "$TRIVY_SHA256" ]; then
            echo "::error::Official Trivy checksum does not match the pinned SHA256"
            exit 1
          fi
          if ! printf '%s  %s\n' "$published_sha" "$ARCHIVE" | sha256sum --check --strict -; then
            echo "::error::Trivy archive SHA256 verification failed"
            exit 1
          fi
          tar -xzf "$ARCHIVE" trivy
          ./trivy config --exit-code 1 .
        continue-on-error: true

  # Session-link hygiene — BLOCKING. Claude sessions must not leak
  # Claude-Session trailers / claude.ai/code URLs into public commit history
  # (fleet rule, Toby 2026-07-31). PR-only, like dependency-scan.
  session-links:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-session-links-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject PR commits containing Claude session links
        # SHAs land via env (not inline interpolation) per workflow-injection
        # hygiene, and are format-checked before use in git commands.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$BASE_SHA$HEAD_SHA" in (*[!0-9a-f]*)
            echo "::error::Unexpected SHA format"; exit 1;;
          esac

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

          if git log --format=%B "$BASE_SHA".."$HEAD_SHA" | grep -E 'Claude-Session:|claude\.ai/code/'; then
            echo "::error::Commit message(s) include Claude session-link trailers. Rewrite the offending commit(s) locally with an interactive rebase and force-push the PR branch; these trailers must not reach public history."
            exit 1
          fi
