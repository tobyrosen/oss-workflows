# Reusable CI workflow (single source of truth)
# Lives at tobyrosen/oss-workflows/.github/workflows/ci.yml. Each repo calls it
# via a ~6-line caller:
#   jobs: { ci: { uses: tobyrosen/oss-workflows/.github/workflows/ci.yml@v1 } }
#
# This is the structural end of the copy-propagation churn: CI logic changes
# here ONCE; callers pin @v1 so nothing moves in them until the tag is bumped.
#
# Runs:
#   - secrets scan (gitleaks) — BLOCKING
#   - pre-commit structural/safety — BLOCKING; style/format — ADVISORY
#   - Python: pytest + coverage + bandit (if pyproject.toml/requirements.txt)
#   - JS/TS: build + npm test (if package.json)
#   - Rust: cargo test + clippy (if Cargo.toml)
#   - dependency-scan (OSV) on PRs
#
# github.event_name inside a called workflow reflects the CALLER's event, so the
# PR-only dependency-scan gate still works. No repo secrets are used, so callers
# do NOT need `secrets: inherit`.

name: CI

on:
  workflow_call:

jobs:
  detect:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-detect-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.check.outputs.python }}
      js: ${{ steps.check.outputs.js }}
      rust: ${{ steps.check.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f package.json ]; then
            echo "js=true" >> "$GITHUB_OUTPUT"
          else
            echo "js=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f Cargo.toml ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  # Secrets scan — BLOCKING. The one security gate that always reds main.
  # Runs the gitleaks binary directly (no gitleaks-action license needed on
  # private/org repos). Catches committed tokens, keys, and credentials.
  secrets:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-secrets-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks (secret scan)
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  # Lint / format / type hooks — ADVISORY, never blocks main.
  # The same hooks auto-FIX locally on commit (prettier / ruff / markdownlint /
  # eof-fixer); in CI they can't re-stage, so blocking here only red-X'd repos
  # whose existing code predated the gate. Secrets block via the `secrets` job
  # above; build via the language jobs; vulns via dependency-scan. This is the
  # gate right-size — style is a local convenience, not a merge gate.
  # (Toby, 2026-06-05: kill the fleet-wide CI churn.)
  pre-commit:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-pre-commit-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@v6
      # Python is the pre-commit runtime (pip install pre-commit below), so it is
      # always needed regardless of the repo's language.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Node is only needed for the JS/TS lint hooks (eslint); skip it on
      # Python/Rust-only repos so they don't pull an unused toolchain.
      - uses: actions/setup-node@v6
        if: needs.detect.outputs.js == 'true'
        with:
          node-version: "22"
      # Rust toolchain so the rustfmt/clippy advisory hooks resolve on Rust repos;
      # without it they error in the advisory step (harmless but noisy log red).
      - uses: dtolnay/rust-toolchain@stable
        if: needs.detect.outputs.rust == 'true'
      # JS/TS repos: install node deps so the eslint pre-commit hook
      # (`npx --no-install eslint`) can resolve a locally-installed eslint.
      # Gated on detect so Python/Rust-only repos skip it. npm ci is used for a
      # clean, lockfile-pinned install; falls back to npm install if out of sync.
      - name: Install node deps (JS/TS lint hooks)
        if: needs.detect.outputs.js == 'true'
        run: npm ci || npm install
      - run: pip install pre-commit
      # Structural / safety hooks BLOCK — malformed YAML/JSON/TOML, committed
      # merge-conflict markers, oversized files, and private keys must fail CI.
      # Only style/format is demoted to advisory. Style hooks are SKIP-listed here
      # (they run in the advisory step below); SKIP silently ignores any hook a
      # given repo doesn't define.
      - name: pre-commit — structural / safety (blocking)
        env:
          SKIP: trailing-whitespace,end-of-file-fixer,mixed-line-ending,markdownlint,typos,ruff,ruff-format,pyright,prettier,eslint,rustfmt,clippy
        run: pre-commit run --all-files --show-diff-on-failure
      # Style / format — ADVISORY: findings are reported in the log but never red
      # main. The same hooks auto-FIX locally on commit, which is where formatting
      # belongs. This is the gate right-size — style is a local convenience.
      - name: pre-commit — style / format (advisory)
        run: pre-commit run --all-files --show-diff-on-failure
        continue-on-error: true

  python:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-python-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.12
      - name: Install deps
        run: |
          if [ -f pyproject.toml ]; then
            uv sync --all-extras || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov bandit pip-audit
      - name: Run pytest
        run: |
          if [ -d tests ] || [ -d test ]; then
            pytest --cov --cov-report=xml || echo "No tests collected"
          else
            echo "No tests directory — skipping pytest"
          fi
      - name: Run bandit (Python security scan)
        run: bandit -r . -x ./tests,./test,./.venv,./venv,./node_modules -ll || true
        continue-on-error: true
      - name: Run pip-audit (dependency CVE scan)
        run: pip-audit --strict || true
        continue-on-error: true

  js:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-js-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.js == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install deps
        run: |
          if [ -f pnpm-lock.yaml ]; then
            npm install -g pnpm && pnpm install
          elif [ -f bun.lockb ] || [ -f bun.lock ]; then
            npm install -g bun && bun install
          else
            npm install
          fi
      # Build — BLOCKING where a build script exists (skipped if absent).
      # "The code builds" is a real gate; style is not.
      - name: Build
        run: npm run build --if-present
      - name: Run tests
        run: npm test --if-present
      - name: Run npm audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

  rust:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-rust-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      - run: cargo clippy --all-targets -- -D warnings

  dependency-scan:
    # Cancel superseded PR runs (cost cut): group per repo+ref+job so a
    # new push to the same PR ref cancels the in-flight run instead of
    # billing it to completion. Scoped to pull_request only — main-push
    # runs are never cancelled (downstream automation consumes them).
    concurrency:
      group: ci-dependency-scan-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # OSV-Scanner (Google) scans lockfiles against the OSV.dev vulnerability DB.
    # Replaces dependency-review-action, which requires GitHub Advanced Security
    # (Dependency Graph + Code Security). GHAS is unavailable on the AsiaProGolf org
    # AND on personal private repos, so dependency-review red-X'd every PR there.
    # OSV-Scanner is free and runs on ANY repo — public, private, any org — with no
    # GHAS dependency. We use the COMPOSITE action (not the reusable PR workflow):
    # the reusable workflow uploads SARIF to the Security tab, which on private repos
    # is itself a GHAS feature and would hit the same wall. The composite action runs
    # the scanner in-container, prints findings to the job log, and fails the job on
    # any known vuln. (Toby, 2026-06-05: keep a working check everywhere, don't skip.)
    # NOTE: scans the whole lockfile and fails on any severity — stricter than the old
    # fail-on-severity:high diff gate. Add a .osv-scanner.toml allowlist for false
    # positives. Docs: https://google.github.io/osv-scanner/github-action/
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./
